# Spring Boot configuration for Java 21 Virtual Threads and web gateway.
# Enables Project Loom virtual threads to handle high concurrency request routing.

server:
  port: 8080

spring:
  application:
    name: gateway-service
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
