# Docker Compose orchestration file for polyglot AI gateway platform.
# Starts Python PyTorch gRPC engine (port 50051) and Java 21 Spring Gateway (port 8080).

services:
  ai-engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: python-ai-engine
    ports:
      - "50051:50051"
    restart: unless-stopped

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: java-gateway-service
    ports:
      - "8080:8080"
    environment:
      - GRPC_HOST=ai-engine
    depends_on:
      - ai-engine
    restart: unless-stopped
